<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 地图演示</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 初始化地图，中心点为杭州市，缩放级别为10
        var map = L.map('map', {
            center: [30.0, 120.0],
            zoom: 10
        });

        // 添加高德地图瓦片图层
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            subdomains: "1234",
            attribution: '&copy; <a href="https://lbs.amap.com/">高德地图</a>'
        }).addTo(map);

        // 在右上角添加比例尺控件
        L.control.scale({
            position: 'topright',
            imperial: false  // 使用公制单位
        }).addTo(map);
    </script>
</body>
</html>
